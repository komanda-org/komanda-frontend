<header class="header" [class.header--panel-open]="notificationsOpen()" data-testid="header">
  <span class="logo" data-testid="logo">Komanda</span>
  <div class="actions">
    <app-notifications (openChange)="notificationsOpen.set($event)" />
    <button type="button" class="logout" data-testid="logout-btn" (click)="logout()">Sair</button>
  </div>
</header>
