<aside class="sidebar" data-testid="sidebar">
  <div class="user">
    <div class="avatar" data-testid="user-avatar">
      @if (profile()?.profilePhoto; as photo) {
        <img [src]="photo" [alt]="'Foto de ' + profile()?.fullName" width="80" height="80">
      } @else {
        <span class="avatar-initials" aria-hidden="true">{{ role() === 'RESTAURANTE' ? 'R' : initials() }}</span>
      }
    </div>
    @if (profile(); as me) {
      <p class="name" data-testid="user-name">{{ me.fullName }}</p>
      <p class="role" data-testid="user-role">{{ me.mainRole }}</p>
    } @else if (role() === 'RESTAURANTE') {
      <p class="role" data-testid="user-role">Restaurante</p>
    }
  </div>
  <nav class="nav" aria-label="Navegação principal">
    @for (item of nav(); track item.path) {
      <a
        class="nav-link"
        [attr.data-testid]="item.testid"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        <span class="nav-icon" [style.--icon-url]="'url(' + item.icon + ')'" aria-hidden="true"></span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
