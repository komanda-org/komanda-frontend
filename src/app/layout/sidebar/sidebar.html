<aside class="sidebar" data-testid="sidebar">
  <div class="user">
    <div class="avatar" data-testid="user-avatar">
      @if (photo(); as src) {
        <img [src]="src" [alt]="(role() === 'RESTAURANTE' ? 'Logotipo de ' : 'Foto de ') + displayName()" width="80" height="80">
      } @else {
        <span class="avatar-initials" aria-hidden="true">{{ initials() || (role() === 'RESTAURANTE' ? 'R' : '') }}</span>
      }
    </div>
    @if (displayName(); as name) {
      <p class="name" data-testid="user-name">{{ name }}</p>
    }
    @if (subtitle(); as text) {
      <p class="role" data-testid="user-role">{{ text }}</p>
    }
  </div>
  <nav class="nav" aria-label="Navegação principal">
    @for (item of nav(); track item.path) {
      <a
        class="nav-link"
        [attr.data-testid]="item.testid"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        <span class="nav-icon" [style.--icon-url]="'url(' + item.icon + ')'" aria-hidden="true"></span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
