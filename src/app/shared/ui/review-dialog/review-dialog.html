<div class="backdrop" (click)="cancel()"></div>
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="review-title" data-testid="review-dialog">
  <h2 class="dialog__title" id="review-title">{{ heading() }}</h2>
  <p class="dialog__who">{{ receiverName() }}</p>

  <form (submit)="$event.preventDefault(); submit()" novalidate>
    <p class="dialog__label" id="review-rating-label">Sua nota</p>
    <div class="rating" role="radiogroup" aria-labelledby="review-rating-label" aria-required="true">
      @for (value of stars; track value) {
        <label class="rating__star" [class.rating__star--on]="value <= rating()">
          <input
            type="radio"
            name="review-rating"
            class="rating__input"
            [value]="value"
            [checked]="rating() === value"
            [attr.aria-label]="starsLabel(value)"
            [attr.data-testid]="'star-' + value"
            (change)="rating.set(value)"
          />
          <span aria-hidden="true">★</span>
        </label>
      }
    </div>

    <label class="dialog__label" for="review-comment">Comentário (opcional)</label>
    <textarea
      id="review-comment"
      class="dialog__comment"
      rows="4"
      [attr.maxlength]="commentMax"
      placeholder="Conte como foi trabalhar junto."
      [value]="comment()"
      (input)="comment.set($any($event.target).value)"
      data-testid="review-comment"
    ></textarea>

    @if (error(); as message) {
      <p class="dialog__error" role="alert" data-testid="review-error">{{ message }}</p>
    }

    <div class="dialog__actions">
      <button type="button" class="action action--ghost" [disabled]="submitting()" (click)="cancel()" data-testid="review-cancel">
        Cancelar
      </button>
      <button type="submit" class="action action--primary" [disabled]="rating() < 1 || submitting()" data-testid="review-submit">
        {{ submitting() ? 'Enviando...' : 'Enviar' }}
      </button>
    </div>
  </form>
</div>
