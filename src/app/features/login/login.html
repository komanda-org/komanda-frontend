<app-moldura>
  <div class="tela">
    <div class="tela__corpo">
      <div class="acesso">
        <h1 class="titulo acesso__titulo" tabindex="-1">Bem-vindo de volta</h1>
        <p class="acesso__apoio">Acesse sua conta para continuar</p>

        @if (mensagem(); as texto) {
          <!-- role="status" (e não "alert") porque é uma boa notícia, não um
               erro: o leitor de tela anuncia sem interromper a leitura. -->
          <p class="aviso aviso--ok acesso__aviso" role="status">{{ texto }}</p>
        }

        @if (nota(); as texto) {
          <p class="aviso aviso--erro acesso__aviso" role="alert">{{ texto }}</p>
        }

        <form class="acesso__form" [formGroup]="form" novalidate (ngSubmit)="entrar()">
          <div class="campo">
            <label class="campo__rotulo campo__rotulo--suave" for="email">E-mail</label>

            <div class="campo-icone campo-icone--inicio">
              <span class="campo-icone__marca" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6" />
                  <path d="M3.5 6.5l8.5 6 8.5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </span>

              <input
                id="email"
                class="entrada"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="nome@exemplo.com"
                formControlName="email"
              />
            </div>

            @if (erro('email'); as texto) {
              <div class="campo__rodape">
                <span class="campo__erro" id="email-erro" role="alert">{{ texto }}</span>
              </div>
            }
          </div>

          <div class="campo">
            <!--
              O rótulo e o "esqueceu a senha?" dividem a mesma linha: quem não
              lembra a senha olha para o campo, não para o rodapé da tela.
            -->
            <div class="acesso__linha-rotulo">
              <label class="campo__rotulo campo__rotulo--suave" for="password">Senha</label>
              <button type="button" class="acesso__link" (click)="esqueciSenha()">
                Esqueceu a senha?
              </button>
            </div>

            <div class="campo-icone campo-icone--inicio">
              <span class="campo-icone__marca" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6" />
                  <path d="M8 10V7.5a4 4 0 018 0V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </span>

              <input
                id="password"
                class="entrada"
                [type]="mostrarSenha() ? 'text' : 'password'"
                autocomplete="current-password"
                placeholder="••••••••"
                formControlName="password"
              />

              <button
                type="button"
                class="campo-icone__acao"
                [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
                [attr.aria-pressed]="mostrarSenha()"
                (click)="mostrarSenha.set(!mostrarSenha())"
              >
                @if (mostrarSenha()) {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.4 5.2A9.5 9.5 0 0112 5c5 0 9 4.5 9 7a11 11 0 01-2.6 3.6M6.2 6.7C3.9 8.2 3 10.4 3 12c0 2.5 4 7 9 7 1.3 0 2.4-.3 3.5-.7"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                  </svg>
                } @else {
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7z" stroke="currentColor" stroke-width="1.7" />
                    <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7" />
                  </svg>
                }
              </button>
            </div>

            @if (erro('password'); as texto) {
              <div class="campo__rodape">
                <span class="campo__erro" id="password-erro" role="alert">{{ texto }}</span>
              </div>
            }
          </div>

          <button type="submit" class="botao botao--frase acesso__enviar">Entrar</button>
        </form>

        <p class="acesso__rodape">
          Não tem uma conta?
          <a class="acesso__link" routerLink="/registro">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</app-moldura>
