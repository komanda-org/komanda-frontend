<main class="login">
  <section class="login__card">
    <p class="login__brand">Komanda</p>
    <h1 class="login__title">Bem-vindo de volta</h1>
    <p class="login__subtitle">Entre para continuar no Komanda.</p>

    @if (errorMessage(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="field__input"
          [class.field__input--invalid]="emailError()"
          autocomplete="email"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
        />
        @if (emailError(); as message) {
          <span id="email-error" class="field__error" role="alert">{{ message }}</span>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="field__input"
          [class.field__input--invalid]="passwordError()"
          autocomplete="current-password"
          [attr.aria-invalid]="passwordError() ? 'true' : null"
          [attr.aria-describedby]="passwordError() ? 'password-error' : null"
        />
        @if (passwordError(); as message) {
          <span id="password-error" class="field__error" role="alert">{{ message }}</span>
        }
      </div>

      <a class="login__forgot" routerLink="/auth/recuperar-senha">Esqueci minha senha</a>

      <button type="submit" class="login__submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="login__footer">
      Não tem uma conta?
      <a routerLink="/registro">Criar conta</a>
    </p>
  </section>
</main>
