<app-moldura>
  <div class="tela">
    <div class="voltar">
      <button type="button" class="voltar__botao" aria-label="Ir para a entrada" (click)="sair()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M19 12H5m0 0l6-6m-6 6l6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <div class="tela__corpo">
      <!--
        Titulo e apoio num bloco so: solto, o <p> herdaria a centralizacao por
        margem automatica do teto de leitura e sairia do eixo do titulo.
      -->
      <div class="escolha__intro">
        <h1 class="titulo titulo--escolha" tabindex="-1">Como você vai usar o Komanda?</h1>
        <p class="subtitulo">Escolha seu perfil para continuar</p>
      </div>

      <!--
        Radios nativos escondidos por baixo dos cartões: as setas do teclado
        navegam entre as opções de graça e o leitor de tela anuncia "1 de 2"
        sem precisarmos de nenhum ARIA extra.
      -->
      <fieldset class="perfis">
        <legend class="perfis__legenda">Escolha seu perfil</legend>

        <label class="perfil" [class.perfil--ativo]="tipo() === 'profissional'">
          <input
            type="radio"
            name="perfil"
            value="profissional"
            class="perfil__radio"
            [checked]="tipo() === 'profissional'"
            (change)="escolher('profissional')"
          />

          <span class="perfil__icone" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 20h14M6 20v-6a6 6 0 0112 0v6M12 8V4M9.5 5.5h5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

          <span class="perfil__nome">Sou profissional</span>
          <span class="perfil__resumo">Garçom, cozinheiro, barista e mais</span>

          <span class="perfil__marca" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="currentColor" />
              <path
                d="M7.5 12.4l3 3 6-6.4"
                stroke="#121212"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </label>

        <label class="perfil" [class.perfil--ativo]="tipo() === 'restaurante'">
          <input
            type="radio"
            name="perfil"
            value="restaurante"
            class="perfil__radio"
            [checked]="tipo() === 'restaurante'"
            (change)="escolher('restaurante')"
          />

          <span class="perfil__icone" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M6 3v8a2 2 0 002 2h0V3M6 7h4M8 13v8M17 3c-1.5 1.5-2 3.5-2 5.5S15.5 12 17 12v9"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

          <span class="perfil__nome">Sou restaurante</span>
          <span class="perfil__resumo">Publique vagas e contrate com agilidade</span>

          <span class="perfil__marca" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="currentColor" />
              <path
                d="M7.5 12.4l3 3 6-6.4"
                stroke="#121212"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </label>
      </fieldset>
    </div>

    <div class="tela__rodape">
      <button type="button" class="botao" (click)="continuar()">Continuar</button>
    </div>
  </div>
</app-moldura>
