<app-moldura>
  <main class="tela">
    <div class="tela__corpo recovery__body">
      <section class="recovery__panel" aria-labelledby="reset-title">
        <h1 id="reset-title" class="titulo recovery__title">Criar nova senha</h1>

        @if (invalidLink(); as reason) {
          <p class="subtitulo recovery__subtitle">Não foi possível usar este link.</p>
          <div class="aviso aviso--erro" role="alert" data-testid="invalid-link">{{ reason }}</div>
          <div class="recovery__actions">
            <a class="botao botao--frase" routerLink="/auth/recuperar-senha" data-testid="new-link">
              Pedir novo link
            </a>
            <a class="botao botao--frase botao--fantasma" routerLink="/login">Voltar ao login</a>
          </div>
        } @else {
          <p class="subtitulo recovery__subtitle">
            Escolha uma senha de {{ passwordMin }} a {{ passwordMax }} caracteres.
          </p>

          @if (errorMessage(); as message) {
            <div class="aviso aviso--erro" role="alert" data-testid="error">{{ message }}</div>
          }

          <form class="recovery__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <app-campo
              rotulo="Nova senha"
              para="password"
              [controle]="form.controls.password"
              [suave]="true"
              [customErrorMessage]="passwordError()"
            >
              <div class="campo-icone campo-icone--inicio">
                <span class="campo-icone__marca" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.7" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                  </svg>
                </span>
                <input
                  id="password"
                  [type]="showPassword() ? 'text' : 'password'"
                  formControlName="password"
                  class="entrada"
                  [class.entrada--invalido]="passwordError()"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  [attr.maxlength]="passwordMax"
                  [attr.aria-invalid]="passwordError() ? 'true' : null"
                  [attr.aria-describedby]="passwordError() ? 'password-erro' : null"
                  data-testid="password-input"
                />
                <button
                  class="campo-icone__acao recovery__visibility"
                  type="button"
                  [attr.aria-label]="showPassword() ? 'Ocultar senhas' : 'Mostrar senhas'"
                  [attr.aria-pressed]="showPassword()"
                  (click)="togglePasswordVisibility()"
                  data-testid="toggle-visibility"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linejoin="round"
                    />
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7" />
                  </svg>
                </button>
              </div>
            </app-campo>

            <app-campo
              rotulo="Confirmar nova senha"
              para="confirmation"
              [controle]="form.controls.confirmation"
              [suave]="true"
              [customErrorMessage]="confirmationError()"
            >
              <div class="campo-icone campo-icone--inicio">
                <span class="campo-icone__marca" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.7" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                  </svg>
                </span>
                <input
                  id="confirmation"
                  [type]="showPassword() ? 'text' : 'password'"
                  formControlName="confirmation"
                  class="entrada"
                  [class.entrada--invalido]="confirmationError()"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  [attr.maxlength]="passwordMax"
                  [attr.aria-invalid]="confirmationError() ? 'true' : null"
                  [attr.aria-describedby]="confirmationError() ? 'confirmation-erro' : null"
                  data-testid="confirmation-input"
                />
              </div>
            </app-campo>

            <button
              type="submit"
              class="botao botao--frase recovery__submit"
              [disabled]="submitting()"
              data-testid="submit"
            >
              {{ submitting() ? 'Salvando...' : 'Salvar nova senha' }}
            </button>
          </form>

          <p class="recovery__footer">
            <a routerLink="/login">Voltar ao login</a>
          </p>
        }
      </section>
    </div>
  </main>
</app-moldura>
