<app-moldura>
  <main class="tela">
    <div class="tela__corpo login__body">
      <section class="login__form-panel" aria-labelledby="login-title">
        <div class="login__form-content">
          <h1 id="login-title" class="titulo login__title">Bem-vindo</h1>
          <p class="subtitulo login__subtitle">Acesse sua conta para continuar.</p>

          @if (mensagem(); as texto) {
            <div class="aviso aviso--ok" role="status">
              <strong>{{ texto }}</strong>
            </div>
          }

          @if (errorMessage(); as message) {
            <p class="login__error" role="alert">{{ message }}</p>
          }

          <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <app-campo
              rotulo="E-mail"
              para="email"
              [controle]="form.controls.email"
              [suave]="true"
              [customErrorMessage]="emailError()"
            >
              <div class="campo-icone campo-icone--inicio">
                <span class="campo-icone__marca" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <rect
                      x="3"
                      y="5"
                      width="18"
                      height="14"
                      rx="2"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />
                    <path
                      d="m4 7 8 6 8-6"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <input
                  id="email"
                  type="email"
                  formControlName="email"
                  class="entrada"
                  [class.entrada--invalido]="emailError()"
                  placeholder="nome@exemplo.com"
                  autocomplete="email"
                  [attr.aria-invalid]="emailError() ? 'true' : null"
                  [attr.aria-describedby]="emailError() ? 'email-erro' : null"
                />
              </div>
            </app-campo>

            <app-campo
              rotulo="Senha"
              para="password"
              [controle]="form.controls.password"
              [suave]="true"
              [customErrorMessage]="passwordError()"
            >
              <a campoAction class="login__forgot" routerLink="/auth/recuperar-senha">
                Esqueceu a senha?
              </a>
              <div class="campo-icone campo-icone--inicio">
                <span class="campo-icone__marca" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <rect
                      x="4"
                      y="10"
                      width="16"
                      height="11"
                      rx="2"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />
                    <path
                      d="M8 10V7a4 4 0 0 1 8 0v3"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <input
                  id="password"
                  [type]="showPassword() ? 'text' : 'password'"
                  formControlName="password"
                  class="entrada"
                  [class.entrada--invalido]="passwordError()"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  [attr.aria-invalid]="passwordError() ? 'true' : null"
                  [attr.aria-describedby]="passwordError() ? 'password-erro' : null"
                />
                <button
                  class="campo-icone__acao login__visibility"
                  type="button"
                  [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
                  [attr.aria-pressed]="showPassword()"
                  (click)="togglePasswordVisibility()"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linejoin="round"
                    />
                    <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7" />
                  </svg>
                </button>
              </div>
            </app-campo>

            <button type="submit" class="botao botao--frase login__submit" [disabled]="submitting()">
              {{ submitting() ? 'Entrando...' : 'Entrar' }}
            </button>
          </form>

          <p class="login__footer">
            Não tem uma conta? <a routerLink="/registro">Cadastre-se</a>
          </p>
        </div>
      </section>
    </div>
  </main>
</app-moldura>
